<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAAGC Testnet Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(10, 30, 61, 0.15);
            overflow: hidden;
            padding: 0;
        }

        /* ===== HERO BANNER ===== */
        .hero-banner {
            width: 100%;
            aspect-ratio: 750 / 1500;
            background: linear-gradient(135deg, #0A1E3D 0%, #003366 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 30px;
        }

        .hero-banner .brand-text {
            text-align: center;
            color: white;
            z-index: 1;
        }

        .hero-banner .brand-text h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-banner .brand-text h1 .highlight {
            color: #F5A623;
        }

        .hero-banner .brand-text p {
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 4px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .hero-banner .brand-text .tagline {
            font-size: 10px;
            opacity: 0.6;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* Decorative dots */
        .hero-banner .dot-pattern {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
        }
        .hero-banner .dot-pattern span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .hero-banner .dot-pattern span.active {
            background: #F5A623;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 28px 24px 32px;
        }

        /* ===== LOGO ===== */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-top: -56px;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .logo-circle {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(10, 30, 61, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #ffffff;
            padding: 10px;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-circle .placeholder-logo {
            font-size: 10px;
            font-weight: 700;
            color: #0A1E3D;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .logo-circle .placeholder-logo span {
            display: block;
            font-size: 8px;
            font-weight: 400;
            color: #00A3A3;
        }

        /* ===== BADGE ===== */
        .badge {
            display: inline-block;
            background: #F5A623;
            color: #0A1E3D;
            font-weight: 700;
            font-size: 11px;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #0A1E3D;
            margin-bottom: 2px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* ===== STATUS ===== */
        .status {
            background: #e6f7f7;
            border: 1px solid #00A3A3;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 16px 0;
            font-size: 14px;
            color: #0A1E3D;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status.error {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .status .icon {
            font-size: 20px;
        }

        /* ===== COUNTER ===== */
        .counter {
            background: #f0f4f8;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 20px;
        }

        .counter-label {
            font-size: 14px;
            color: #0A1E3D;
            font-weight: 500;
        }

        .counter-number {
            font-size: 28px;
            font-weight: 800;
            color: #00A3A3;
        }

        .counter-number .total {
            font-weight: 400;
            color: #94a3b8;
            font-size: 18px;
        }

        /* ===== BUTTON ===== */
        .pay-btn {
            width: 100%;
            background: #00A3A3;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0, 163, 163, 0.30);
        }

        .pay-btn:hover {
            background: #008888;
            transform: scale(1.01);
            box-shadow: 0 6px 24px rgba(0, 163, 163, 0.40);
        }

        .pay-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .pay-btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== LOG ===== */
        .log {
            margin-top: 20px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            color: #0A1E3D;
            border: 1px solid #e2e8f0;
            max-height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }

        .log-empty {
            color: #94a3b8;
            font-style: italic;
        }

        .log .highlight-log {
            color: #00A3A3;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .content { padding: 20px 16px 24px; }
            .logo-circle { width: 72px; height: 72px; margin-top: -48px; padding: 8px; }
            .title { font-size: 19px; }
            .counter-number { font-size: 24px; }
            .hero-banner .brand-text h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HERO BANNER ===== -->
    <div class="hero-banner">
        <div class="brand-text">
            <h1>TRIPLE A <span class="highlight">✦</span> HALAL</h1>
            <p>Agriculture · Industry · Tech</p>
            <div class="tagline">✦ Innovate · Empower · Elevate ✦</div>
        </div>
        <div class="dot-pattern">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="content">

        <!-- ===== LOGO ===== -->
        <div class="logo-wrapper">
            <div class="logo-circle">
                <!-- REPLACE WITH YOUR 400x400 LOGO -->
                <img src="/assets/400x400.png" alt="TAAGC Logo" />
                <!-- FALLBACK if image not found -->
                <!--
                <div class="placeholder-logo">
                    TAAGC
                    <span>global concept</span>
                </div>
                -->
            </div>
        </div>

        <!-- ===== HEADER ===== -->
        <div style="text-align: center;">
            <div class="badge">🧪 PI TESTNET</div>
            <h1 class="title">Payment Verification</h1>
            <p class="subtitle">Send test Pi to activate your app wallet</p>
        </div>

        <!-- ===== STATUS ===== -->
        <div class="status" id="status">
            <span class="icon">✅</span>
            <span>Ready to send test payments</span>
        </div>

        <!-- ===== COUNTER ===== -->
        <div class="counter">
            <span class="counter-label">📊 Progress</span>
            <span class="counter-number">
                <span id="count">0</span>
                <span class="total">/ 5</span>
            </span>
        </div>

        <!-- ===== PAY BUTTON ===== -->
        <button class="pay-btn" id="payBtn" onclick="sendPayment()">
            💸 Send 0.01 Test Pi
        </button>

        <!-- ===== LOG ===== -->
        <div class="log" id="log">
            <span class="log-empty">📋 Ready. Tap the button to start.</span>
        </div>

    </div>
</div>

<script>
    // ============================================================
    //  CONFIGURATION – REPLACE WITH YOUR TESTNET CREDENTIALS
    // ============================================================
    const APP_ID = 'YOUR_APP_ID';           // from pi://develop.pi
    const WALLET_SEED = 'YOUR_WALLET_SEED'; // starts with "S"
    // ============================================================

    let completedCount = 0;
    const TARGET = 5;
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const btn = document.getElementById('payBtn');

    // Load progress
    if (localStorage.getItem('taagc_test_count')) {
        completedCount = parseInt(localStorage.getItem('taagc_test_count'));
        updateCounter();
    }

    function updateCounter() {
        countEl.textContent = completedCount;
        localStorage.setItem('taagc_test_count', completedCount);

        if (completedCount >= TARGET) {
            statusEl.innerHTML = '<span class="icon">🎉</span><span>All 5 done! Submit your Mainnet app now.</span>';
            statusEl.className = 'status';
            btn.disabled = true;
            btn.innerHTML = '✅ Ready to Submit Application';
        }
    }

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        const entry = `[${time}] ${msg}`;
        logEl.innerHTML = entry + '\n' + logEl.innerHTML;
        if (logEl.querySelector('.log-empty')) {
            logEl.innerHTML = entry + '\n';
        }
    }

    async function sendPayment() {
        if (completedCount >= TARGET) {
            log('✅ Already completed all 5 transactions.');
            return;
        }

        if (typeof Pi === 'undefined') {
            statusEl.className = 'status error';
            statusEl.innerHTML = '<span class="icon">❌</span><span>Please open this page in the Pi Browser.</span>';
            log('❌ Pi SDK not found – open in Pi Browser');
            return;
        }

        try {
            Pi.init({
                appId: APP_ID,
                wallet: WALLET_SEED,
                network: 'testnet'
            });
            log('✅ Pi SDK initialized (Testnet)');
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerHTML = `<span class="icon">❌</span><span>Init failed: ${err.message}</span>`;
            log(`❌ Init error: ${err.message}`);
            return;
        }

        let user;
        try {
            user = await Pi.authenticate();
            log(`👤 Authenticated: ${user.uid}`);
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerHTML = '<span class="icon">🔑</span><span>Please log into Pi Browser first.</span>';
            log(`❌ Auth error: ${err.message}`);
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Processing...';
        statusEl.className = 'status';
        statusEl.innerHTML = '<span class="icon">⏳</span><span>Creating payment...</span>';

        try {
            const payment = await Pi.createPayment({
                amount: 0.01,
                memo: 'TAAGC Testnet verification',
                metadata: { purpose: 'developer test', app: 'TAAGC' },
                uid: user.uid
            });
            log(`📤 Payment created: ${payment.identifier}`);

            statusEl.innerHTML = '<span class="icon">⛓️</span><span>Submitting to Testnet...</span>';
            const submitted = await Pi.submitPayment(payment.identifier);
            log(`⛓️ Submitted: ${submitted.txid}`);

            statusEl.innerHTML = '<span class="icon">✅</span><span>Finalizing...</span>';
            const completed = await Pi.completePayment(payment.identifier, submitted.txid);
            log(`✅ COMPLETE! Tx: ${completed.txid}`);

            completedCount++;
            updateCounter();
            statusEl.className = 'status';
            statusEl.innerHTML = `<span class="icon">✅</span><span>Payment #${completedCount} successful!</span>`;
            log(`🎉 Payment #${completedCount} done.`);

            if (completedCount >= TARGET) {
                statusEl.innerHTML = '<span class="icon">🎉</span><span>All 5 done! Submit your Mainnet app now.</span>';
                btn.disabled = true;
                btn.innerHTML = '✅ Ready to Submit Application';
            }

        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerHTML = `<span class="icon">❌</span><span>Error: ${err.message}</span>`;
            log(`❌ Payment failed: ${err.message}`);
        } finally {
            btn.disabled = false;
            if (completedCount < TARGET) {
                btn.innerHTML = '💸 Send 0.01 Test Pi';
            }
        }
    }

    window.onload = function() {
        log('📱 TAAGC Testnet Demo loaded');
        if (typeof Pi === 'undefined') {
            log('⚠️ Pi SDK not detected – use Pi Browser');
            statusEl.className = 'status error';
            statusEl.innerHTML = '<span class="icon">⚠️</span><span>Open in Pi Browser for Testnet.</span>';
        } else {
            log('✅ Pi SDK detected');
        }
        updateCounter();
    };
</script>

</body>
</html>
