<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pi SDK Test</title>
</head>
<body>
    <h1>Pi Test</h1>
    <p id="status">Loading Pi SDK...</p>
    <button onclick="checkPi()">Check Pi</button>

    <script>
        const APP_ID = 'd54r1mfz7thtxwrg7lvtfckdg2kicb0yrctweyqvpnvnfjp6ufuzfwalggphclfw';
        const WALLET_SEED = 'CXLsORDpo8uyNGBio9oSIpSXvFuIOznimsFk4f-hSQY';

        function log(msg) {
            document.getElementById('status').textContent = msg;
        }

        function checkPi() {
            if (typeof Pi === 'undefined') {
                log('❌ Pi SDK not found. Open in Pi Browser and authorize sandbox.');
                return;
            }
            log('✅ Pi SDK found! Initializing...');

            Pi.init({
                appId: APP_ID,
                wallet: WALLET_SEED,
                network: 'testnet',
                sandbox: true
            });

            log('✅ Init done. Try clicking again to authenticate.');
        }

        window.onload = function() {
            if (typeof Pi !== 'undefined') {
                log('✅ Pi SDK loaded! Click "Check Pi" to initialize.');
            } else {
                log('⚠️ Pi SDK not loaded. Open in Pi Browser.');
            }
        };
    </script>
</body>
</html>
